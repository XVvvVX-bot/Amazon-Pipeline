name: Daily Steam Review Pipeline

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "Use filter=recent and remove the per-app page cap"
        required: false
        default: false
        type: boolean
      max_pages_per_app:
        description: "Maximum review pages per app; 0 means no cap"
        required: false
        default: "50"
        type: string

permissions:
  contents: write

concurrency:
  group: daily-steam-review-pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest Steam cumulative data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          run_with_retry() {
            local name="$1"
            local max_attempts="$2"
            local optional="$3"
            shift 3

            local attempt
            local status
            for attempt in $(seq 1 "$max_attempts"); do
              set +e
              "$@"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              echo "WARNING: $name failed on attempt $attempt of $max_attempts with exit code $status." >&2
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep $(( attempt * 10 > 60 ? 60 : attempt * 10 ))
              fi
            done

            if [ "$optional" = "true" ]; then
              return 1
            fi
            echo "$name failed after $max_attempts attempts." >&2
            return "$status"
          }

          mkdir -p data data/exports
          if ! run_with_retry "Download steam_reviews.sqlite" 3 true gh release download latest-steam-data --pattern steam_reviews.sqlite --dir data --clobber; then
            echo "No previous steam_reviews.sqlite release asset found; continuing."
          fi
          if ! run_with_retry "Download steam_reviews.csv" 3 true gh release download latest-steam-data --pattern steam_reviews.csv --dir data/exports --clobber; then
            echo "No previous steam_reviews.csv release asset found; continuing."
          fi

      - name: Run tests
        run: python -m pytest -q

      - name: Run daily Steam pipeline
        env:
          INPUT_FULL_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_backfill || 'false' }}
          INPUT_MAX_PAGES_PER_APP: ${{ github.event_name == 'workflow_dispatch' && inputs.max_pages_per_app || '50' }}
        run: |
          set -euo pipefail

          review_filter="updated"
          max_pages_per_app="$INPUT_MAX_PAGES_PER_APP"
          if [ "$INPUT_FULL_BACKFILL" = "true" ]; then
            review_filter="recent"
            max_pages_per_app=0
            echo "Manual full backfill enabled: filter=recent and max_pages_per_app=0."
          fi

          python steam_pipeline.py daily \
            --review-filter "$review_filter" \
            --max-pages-per-app "$max_pages_per_app" \
            --num-per-page 100 \
            --language english \
            --purchase-type all \
            --review-type all \
            --request-delay-seconds 1 \
            --max-attempts 3 \
            --retry-delay-seconds 10

      - name: Upload Steam daily artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: steam-daily-pipeline-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/raw/steam/
            data/reports/steam/
            data/exports/steam_reviews.csv
            data/steam_reviews.sqlite

      - name: Update latest-steam-data release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          run_with_retry() {
            local name="$1"
            local max_attempts="$2"
            local optional="$3"
            shift 3

            local attempt
            local status
            for attempt in $(seq 1 "$max_attempts"); do
              set +e
              "$@"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              echo "WARNING: $name failed on attempt $attempt of $max_attempts with exit code $status." >&2
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep $(( attempt * 15 > 90 ? 90 : attempt * 15 ))
              fi
            done

            if [ "$optional" = "true" ]; then
              return 1
            fi
            echo "$name failed after $max_attempts attempts." >&2
            return "$status"
          }

          if ! run_with_retry "View latest-steam-data release" 4 true gh release view latest-steam-data; then
            run_with_retry "Create latest-steam-data release" 4 false gh release create latest-steam-data --title "Latest Steam data" --notes "Latest cumulative Steam review pipeline outputs" --latest=false
          fi

          assets=()
          if [ -f "data/steam_reviews.sqlite" ]; then
            assets+=("data/steam_reviews.sqlite")
          fi
          if [ -f "data/exports/steam_reviews.csv" ]; then
            assets+=("data/exports/steam_reviews.csv")
          fi

          if [ "${#assets[@]}" -gt 0 ]; then
            run_with_retry "Upload latest-steam-data assets" 4 false gh release upload latest-steam-data "${assets[@]}" --clobber
          fi
