name: Daily Steam Review Pipeline

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "Use filter=recent and remove the per-app page cap"
        required: false
        default: false
        type: boolean
      max_pages_per_app:
        description: "Maximum review pages per app; 0 means no cap"
        required: false
        default: "50"
        type: string

permissions:
  contents: read

concurrency:
  group: daily-steam-review-pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create Python virtualenv
        run: |
          set -euo pipefail
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Check local Postgres
        env:
          DATABASE_URL: ${{ secrets.STEAM_DATABASE_URL }}
        run: |
          set -euo pipefail
          database_url="${DATABASE_URL:-postgresql:///steam_reviews}"
          .venv/bin/python steam_pipeline.py init-postgres --database-url "$database_url"

      - name: Run tests
        run: .venv/bin/python -m pytest -q

      - name: Run daily Steam pipeline
        env:
          DATABASE_URL: ${{ secrets.STEAM_DATABASE_URL }}
          INPUT_FULL_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_backfill || 'false' }}
          INPUT_MAX_PAGES_PER_APP: ${{ github.event_name == 'workflow_dispatch' && inputs.max_pages_per_app || '50' }}
        run: |
          set -euo pipefail

          review_filter="updated"
          max_pages_per_app="$INPUT_MAX_PAGES_PER_APP"
          database_url="${DATABASE_URL:-postgresql:///steam_reviews}"
          if [ "$INPUT_FULL_BACKFILL" = "true" ]; then
            review_filter="recent"
            max_pages_per_app=0
            echo "Manual full backfill enabled: filter=recent and max_pages_per_app=0."
          fi

          .venv/bin/python steam_pipeline.py daily \
            --database-url "$database_url" \
            --review-filter "$review_filter" \
            --max-pages-per-app "$max_pages_per_app" \
            --num-per-page 100 \
            --language english \
            --purchase-type all \
            --review-type all \
            --request-delay-seconds 1 \
            --max-attempts 3 \
            --retry-delay-seconds 10

      - name: Upload Steam daily artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: steam-daily-pipeline-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/raw/steam/
            data/reports/steam/
