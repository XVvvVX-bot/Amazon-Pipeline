name: Daily Amazon Review Pipeline

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      retry_recent_blocked:
        description: "Retry targets currently in the 3-day blocked/CAPTCHA cooldown"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-amazon-review-pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: [self-hosted, amazon-acquisition]
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Add GitHub CLI to PATH
        run: |
          $ghDir = "C:\Program Files\GitHub CLI"
          if (Test-Path "$ghDir\gh.exe") {
            $ghDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify runner Python
        run: |
          $pythonExe = "C:/actions-runner/python312/python.exe"
          if (-not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) {
            throw "Python executable was not found at $pythonExe. Place an accessible Python 3.12 runtime there before running acquisition."
          }
          & $pythonExe --version
          Write-Host "Using Python at $pythonExe"

      - name: Check runner prerequisites
        run: |
          $pythonExe = "C:/actions-runner/python312/python.exe"
          & $pythonExe --version
          $pythonVersion = & $pythonExe -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($pythonVersion -ne "3.12") {
            throw "Python 3.12 is required on the self-hosted runner. Found Python $pythonVersion."
          }
          git --version
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            throw "GitHub CLI 'gh' is required on the self-hosted runner. Install it from https://cli.github.com/ and authenticate it before running acquisition."
          }
          gh --version

      - name: Install dependencies
        run: '& "C:/actions-runner/python312/python.exe" -m pip install -r requirements.txt'

      - name: Install Playwright Chromium
        run: '& "C:/actions-runner/python312/python.exe" -m playwright install chromium'

      - name: Download latest cumulative data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path "data", "data/exports" | Out-Null
          gh release download latest-data --pattern reviews.sqlite --dir data --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous reviews.sqlite release asset found; continuing."
          }
          gh release download latest-data --pattern reviews.csv --dir data/exports --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous reviews.csv release asset found; continuing."
          }

      - name: Run tests
        run: '& "C:/actions-runner/python312/python.exe" -m pytest -q'

      - name: Run daily pipeline
        run: |
          $blockedCooldownDays = 3
          if ("${{ inputs.retry_recent_blocked }}" -eq "true") {
            $blockedCooldownDays = 0
            Write-Host "Manual experiment enabled: retrying recently blocked targets."
          }

          & "C:/actions-runner/python312/python.exe" amazon_pipeline.py daily `
            --fetch-method playwright `
            --batch-size 25 `
            --batch-cooldown-min-minutes 5 `
            --batch-cooldown-max-minutes 12 `
            --target-delay-min-seconds 5 `
            --target-delay-max-seconds 15 `
            --adaptive-slow-block-rate 0.05 `
            --adaptive-strong-slow-block-rate 0.15 `
            --adaptive-slowdown-multiplier 2 `
            --adaptive-strong-slowdown-multiplier 3 `
            --blocked-cooldown-days $blockedCooldownDays `
            --max-runtime-minutes 300 `
            --max-block-rate 0.25 `
            --max-consecutive-blocked 5

      - name: Upload daily artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-pipeline-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/raw/
            data/parsed/
            data/discovery/
            data/reports/
            data/exports/

      - name: Update latest-data release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-data *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest-data --title "Latest data" --notes "Latest cumulative pipeline outputs" --latest=false
          }

          $assets = @()
          if (Test-Path "data/reviews.sqlite") {
            $assets += "data/reviews.sqlite"
          }
          if (Test-Path "data/exports/reviews.csv") {
            $assets += "data/exports/reviews.csv"
          }

          if ($assets.Count -gt 0) {
            gh release upload latest-data @assets --clobber
          }

      - name: Commit updated targets and state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/targets/amazon_products.csv data/state/pipeline_state.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update daily pipeline state [skip ci]"
            git push
          }
