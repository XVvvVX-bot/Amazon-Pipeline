name: Daily Amazon Review Pipeline

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-amazon-review-pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest cumulative data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data data/exports
          gh release download latest-data --pattern reviews.sqlite --dir data --clobber || true
          gh release download latest-data --pattern reviews.csv --dir data/exports --clobber || true

      - name: Run tests
        run: pytest -q

      - name: Run daily pipeline
        run: |
          python amazon_pipeline.py daily \
            --batch-size 50 \
            --batch-cooldown-minutes 10 \
            --max-runtime-minutes 300 \
            --max-block-rate 0.25 \
            --max-consecutive-blocked 5

      - name: Upload daily artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-pipeline-${{ github.run_id }}
          retention-days: 14
          path: |
            data/raw/
            data/parsed/
            data/discovery/
            data/reports/
            data/exports/

      - name: Update latest-data release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-data >/dev/null 2>&1 || \
            gh release create latest-data --title "Latest data" --notes "Latest cumulative pipeline outputs" --latest=false

          assets=()
          [ -f data/reviews.sqlite ] && assets+=("data/reviews.sqlite")
          [ -f data/exports/reviews.csv ] && assets+=("data/exports/reviews.csv")

          if [ "${#assets[@]}" -gt 0 ]; then
            gh release upload latest-data "${assets[@]}" --clobber
          fi

      - name: Commit updated targets and state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/targets/amazon_products.csv data/state/pipeline_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily pipeline state [skip ci]"
            git push
          fi
