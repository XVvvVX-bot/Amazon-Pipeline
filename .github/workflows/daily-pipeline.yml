name: Daily Amazon Review Pipeline

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-amazon-review-pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: [self-hosted, amazon-acquisition]
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Add GitHub CLI to PATH
        run: |
          $ghDir = "C:\Program Files\GitHub CLI"
          if (Test-Path "$ghDir\gh.exe") {
            Add-Content -Path $env:GITHUB_PATH -Value $ghDir
          }

      - name: Locate Python
        run: |
          $pythonCandidates = @(
            (Get-Command python -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            "C:\actions-runner\python312\python.exe",
            "C:\Program Files\Python312\python.exe",
            "C:\Program Files\Python311\python.exe"
          ) | Where-Object { $_ -and (Test-Path $_ -ErrorAction SilentlyContinue) }

          if (-not $pythonCandidates -or $pythonCandidates.Count -eq 0) {
            throw "Python executable was not found. Install Python 3.12 for all users, or place an accessible Python at C:\actions-runner\python312\python.exe."
          }

          $pythonExe = $pythonCandidates[0]
          Add-Content -Path $env:GITHUB_ENV -Value "PYTHON_EXE=$pythonExe"
          Write-Host "Using Python at $pythonExe"

      - name: Check runner prerequisites
        run: |
          & $env:PYTHON_EXE --version
          $pythonVersion = & $env:PYTHON_EXE -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($pythonVersion -ne "3.12") {
            throw "Python 3.12 is required on the self-hosted runner. Found Python $pythonVersion."
          }
          git --version
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            throw "GitHub CLI 'gh' is required on the self-hosted runner. Install it from https://cli.github.com/ and authenticate it before running acquisition."
          }
          gh --version

      - name: Install dependencies
        run: '& $env:PYTHON_EXE -m pip install -r requirements.txt'

      - name: Install Playwright Chromium
        run: '& $env:PYTHON_EXE -m playwright install chromium'

      - name: Download latest cumulative data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path "data", "data/exports" | Out-Null
          gh release download latest-data --pattern reviews.sqlite --dir data --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous reviews.sqlite release asset found; continuing."
          }
          gh release download latest-data --pattern reviews.csv --dir data/exports --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous reviews.csv release asset found; continuing."
          }

      - name: Run tests
        run: '& $env:PYTHON_EXE -m pytest -q'

      - name: Run daily pipeline
        run: |
          & $env:PYTHON_EXE amazon_pipeline.py daily `
            --fetch-method playwright `
            --batch-size 10 `
            --batch-cooldown-minutes 10 `
            --target-delay-seconds 3 `
            --max-runtime-minutes 300 `
            --max-block-rate 0.25 `
            --max-consecutive-blocked 5

      - name: Upload daily artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-pipeline-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/raw/
            data/parsed/
            data/discovery/
            data/reports/
            data/exports/

      - name: Update latest-data release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-data *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest-data --title "Latest data" --notes "Latest cumulative pipeline outputs" --latest=false
          }

          $assets = @()
          if (Test-Path "data/reviews.sqlite") {
            $assets += "data/reviews.sqlite"
          }
          if (Test-Path "data/exports/reviews.csv") {
            $assets += "data/exports/reviews.csv"
          }

          if ($assets.Count -gt 0) {
            gh release upload latest-data @assets --clobber
          }

      - name: Commit updated targets and state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/targets/amazon_products.csv data/state/pipeline_state.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update daily pipeline state [skip ci]"
            git push
          }
