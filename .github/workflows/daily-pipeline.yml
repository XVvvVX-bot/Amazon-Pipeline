name: Daily Amazon Review Pipeline

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      retry_recent_blocked:
        description: "Retry targets currently in the 3-day blocked/CAPTCHA cooldown"
        required: false
        default: false
        type: boolean
      refetch_everything:
        description: "Refetch every active target, including recent successes and blocked targets"
        required: false
        default: false
        type: boolean
      aggressive_stress_test:
        description: "Manual-only full Best Sellers discovery and faster refetch stress test"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-amazon-review-pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: [self-hosted, amazon-acquisition]
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve Python
        run: |
          set -euo pipefail

          python_bin=""
          for candidate in python3.12 python3 python; do
            if ! command -v "$candidate" >/dev/null 2>&1; then
              continue
            fi
            version="$("$candidate" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
            if [ "$version" = "3.12" ]; then
              python_bin="$(command -v "$candidate")"
              break
            fi
          done

          if [ -z "$python_bin" ]; then
            echo "Python 3.12 is required on the self-hosted runner. Install it or expose it as python3.12/python3 on PATH." >&2
            exit 1
          fi

          echo "PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"
          "$python_bin" --version
          echo "Using Python at $python_bin"

      - name: Check runner prerequisites
        run: |
          set -euo pipefail

          "$PYTHON_BIN" --version
          python_version="$("$PYTHON_BIN" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          if [ "$python_version" != "3.12" ]; then
            echo "Python 3.12 is required on the self-hosted runner. Found Python $python_version." >&2
            exit 1
          fi

          git --version
          if ! command -v gh >/dev/null 2>&1; then
            echo "GitHub CLI 'gh' is required on the self-hosted runner. Install it and make sure it is on PATH before running acquisition." >&2
            exit 1
          fi
          gh --version

      - name: Install dependencies
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m playwright install chromium

      - name: Download latest cumulative data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          run_with_retry() {
            local name="$1"
            local max_attempts="$2"
            local optional="$3"
            shift 3

            local attempt
            local status
            for attempt in $(seq 1 "$max_attempts"); do
              set +e
              "$@"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              echo "WARNING: $name failed on attempt $attempt of $max_attempts with exit code $status." >&2
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep $(( attempt * 10 > 60 ? 60 : attempt * 10 ))
              fi
            done

            if [ "$optional" = "true" ]; then
              return 1
            fi
            echo "$name failed after $max_attempts attempts." >&2
            return "$status"
          }

          mkdir -p data data/exports
          if ! run_with_retry "Download reviews.sqlite" 3 true gh release download latest-data --pattern reviews.sqlite --dir data --clobber; then
            echo "No previous reviews.sqlite release asset found; continuing."
          fi
          if ! run_with_retry "Download reviews.csv" 3 true gh release download latest-data --pattern reviews.csv --dir data/exports --clobber; then
            echo "No previous reviews.csv release asset found; continuing."
          fi

      - name: Run tests
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m pytest -q

      - name: Run daily pipeline
        run: |
          set -euo pipefail

          stale_days=7
          blocked_cooldown_days=3
          max_seed_pages=12
          max_departments=12
          max_subdepartment_depth=1
          max_subdepartment_pages=25
          max_pages_per_seed=1
          batch_size=45
          batch_cooldown_min_minutes=3
          batch_cooldown_max_minutes=6
          target_delay_min_seconds=5
          target_delay_max_seconds=12
          max_runtime_minutes=180
          max_block_rate=0.20
          max_consecutive_blocked=5

          if [ "${{ inputs.retry_recent_blocked }}" = "true" ]; then
            blocked_cooldown_days=0
            echo "Manual experiment enabled: retrying recently blocked targets."
          fi

          if [ "${{ inputs.refetch_everything }}" = "true" ]; then
            stale_days=0
            blocked_cooldown_days=0
            echo "Manual experiment enabled: refetching every active target."
          fi

          if [ "${{ inputs.aggressive_stress_test }}" = "true" ]; then
            stale_days=0
            blocked_cooldown_days=0
            max_seed_pages=0
            max_departments=0
            max_subdepartment_depth=0
            max_subdepartment_pages=0
            max_pages_per_seed=0
            batch_size=50
            batch_cooldown_min_minutes=1
            batch_cooldown_max_minutes=3
            target_delay_min_seconds=1
            target_delay_max_seconds=4
            max_runtime_minutes=345
            max_block_rate=0.35
            max_consecutive_blocked=10
            echo "Manual aggressive stress test enabled: unbounded Best Sellers discovery and faster full refetch."
          fi

          "$PYTHON_BIN" amazon_pipeline.py daily \
            --fetch-method playwright \
            --max-seed-pages "$max_seed_pages" \
            --max-departments "$max_departments" \
            --max-subdepartment-depth "$max_subdepartment_depth" \
            --max-subdepartment-pages "$max_subdepartment_pages" \
            --max-pages-per-seed "$max_pages_per_seed" \
            --batch-size "$batch_size" \
            --batch-cooldown-min-minutes "$batch_cooldown_min_minutes" \
            --batch-cooldown-max-minutes "$batch_cooldown_max_minutes" \
            --target-delay-min-seconds "$target_delay_min_seconds" \
            --target-delay-max-seconds "$target_delay_max_seconds" \
            --adaptive-slow-block-rate 0.05 \
            --adaptive-strong-slow-block-rate 0.15 \
            --adaptive-slowdown-multiplier 2 \
            --adaptive-strong-slowdown-multiplier 3 \
            --stale-days "$stale_days" \
            --blocked-cooldown-days "$blocked_cooldown_days" \
            --max-runtime-minutes "$max_runtime_minutes" \
            --max-block-rate "$max_block_rate" \
            --max-consecutive-blocked "$max_consecutive_blocked"

      - name: Upload daily artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: daily-pipeline-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/raw/
            data/parsed/
            data/discovery/
            data/reports/
            data/exports/

      - name: Update latest-data release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          run_with_retry() {
            local name="$1"
            local max_attempts="$2"
            local optional="$3"
            shift 3

            local attempt
            local status
            for attempt in $(seq 1 "$max_attempts"); do
              set +e
              "$@"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              echo "WARNING: $name failed on attempt $attempt of $max_attempts with exit code $status." >&2
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep $(( attempt * 15 > 90 ? 90 : attempt * 15 ))
              fi
            done

            if [ "$optional" = "true" ]; then
              return 1
            fi
            echo "$name failed after $max_attempts attempts." >&2
            return "$status"
          }

          if ! run_with_retry "View latest-data release" 4 true gh release view latest-data; then
            run_with_retry "Create latest-data release" 4 false gh release create latest-data --title "Latest data" --notes "Latest cumulative pipeline outputs" --latest=false
          fi

          assets=()
          if [ -f "data/reviews.sqlite" ]; then
            assets+=("data/reviews.sqlite")
          fi
          if [ -f "data/exports/reviews.csv" ]; then
            assets+=("data/exports/reviews.csv")
          fi

          if [ "${#assets[@]}" -gt 0 ]; then
            run_with_retry "Upload latest-data assets" 4 false gh release upload latest-data "${assets[@]}" --clobber
          fi

      - name: Commit updated targets and state
        if: success()
        run: |
          set -euo pipefail

          if [ "${{ inputs.aggressive_stress_test }}" = "true" ]; then
            echo "Skipping Git commit for aggressive stress test; large run outputs are preserved in artifacts and the latest-data release."
            exit 0
          fi

          max_target_rows=5000
          target_rows=0
          if [ -f "data/targets/amazon_products.csv" ]; then
            target_rows=$(wc -l < data/targets/amazon_products.csv | tr -d ' ')
          fi
          if [ "$target_rows" -gt "$max_target_rows" ]; then
            echo "Skipping Git commit because data/targets/amazon_products.csv has $target_rows rows, above the $max_target_rows row safety limit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/targets/amazon_products.csv data/state/pipeline_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily pipeline state [skip ci]"
            git push
          fi
